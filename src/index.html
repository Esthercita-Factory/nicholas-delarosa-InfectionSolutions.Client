<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>InfectionSolutions · Portal de clientes</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Compra materiales de construcción en línea: catálogo, carrito y comprobante en tu correo.">
  <meta name="theme-color" content="#1F2427">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <script>
    // Tema antes de pintar: el guardado, o el del sistema. Evita el destello claro en modo oscuro.
    (function () {
      var tema = null;
      try { tema = JSON.parse(localStorage.getItem('is.portal.tema')); } catch (e) {}
      if (tema !== 'light' && tema !== 'dark') {
        tema = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', tema);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
